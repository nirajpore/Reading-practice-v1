<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 30px;
    }

    button {
      background: #3478f6;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    #story {
      margin-top: 30px;
      text-align: left;
      font-size: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    #status {
      margin-top: 15px;
      color: #666;
    }

    .inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
      align-items: stretch;
    }

    input[type="text"], input[type="password"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📚 Reading Practice</h1>

    <p>Generate short children's stories. Paste your OpenAI API key below (this is stored only in the browser session).</p>

    <div class="inputs">
      <div>
        <label for="apiKey">OpenAI API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." />
      </div>

      <div>
        <label for="theme">Story theme (e.g., "forest", "space adventure")</label>
        <input id="theme" type="text" placeholder="Enter a theme for the story" />
      </div>
    </div>

    <button id="generateButton" onclick="generateStory()">
      Generate a Story
    </button>

    <div id="status"></div>

    <div id="story"></div>

  </div>

<script>

async function generateStory() {

  const button = document.getElementById("generateButton");
  const status = document.getElementById("status");
  const story = document.getElementById("story");
  const apiKeyInput = document.getElementById("apiKey");
  const themeInput = document.getElementById("theme");

  const apiKey = apiKeyInput.value.trim();
  const theme = themeInput.value.trim() || "a friendly animal";

  if (!apiKey) {
    alert('Please paste your OpenAI API key into the "OpenAI API Key" field.');
    return;
  }

  button.disabled = true;
  status.innerText = "Creating your story...";
  story.innerText = "";

  try {
    const prompt = `Write a short, friendly children's story (3-6 short paragraphs) about the theme: "${theme}". Keep language simple and positive.`;

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: "gpt-3.5-turbo",
        messages: [{ role: "user", content: prompt }],
        max_tokens: 500,
        temperature: 0.8
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`OpenAI API error: ${response.status} ${response.statusText} - ${errText}`);
    }

    const data = await response.json();

    // The assistant reply is usually in data.choices[0].message.content
    const generated = data?.choices?.[0]?.message?.content;

    if (!generated) {
      throw new Error('No story returned from the API.');
    }

    story.innerText = generated.trim();
    status.innerText = "Ready to read!";

  } catch (err) {
    console.error(err);
    status.innerText = "Error: " + (err.message || err);
  } finally {
    button.disabled = false;
  }

}

</script>

</body>
</html>
